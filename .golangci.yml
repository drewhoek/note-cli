linters:
  enable:
    - errcheck      # unhandled errors (caught our mustCreate issue)
    - govet         # same as go vet
    - staticcheck   # broad static analysis
    - unused        # unexported identifiers that are never used
    - gosimple      # simplifications the compiler won't enforce

linters-settings:
  errcheck:
    # don't flag intentional discards like io.Close in defer
    check-type-assertions: true
